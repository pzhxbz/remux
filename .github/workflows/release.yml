name: CI and distributable binaries

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to build and publish (leave empty for CI only)
        required: false
        type: string
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: remux-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}
      - name: Install stock tmux
        run: sudo apt-get update && sudo apt-get install --yes tmux
      - name: Install project Rust toolchain
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component clippy
          rustup default 1.85.0
      - name: Cargo quality gate
        run: |
          cargo check
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test

  android:
    name: Android APKs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}
      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
            android/app/*.gradle.kts
      - name: Android quality gate
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleDebug assembleRelease lintDebug --no-daemon
      - name: Stage Android artifacts
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/remux-android-debug.apk
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v7
        with:
          name: remux-android-debug
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

  android-release:
    name: Signed Android Release APK
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}
      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
            android/app/*.gradle.kts
      - name: Assemble unsigned Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Sign and verify Release APK
        env:
          REMUX_ANDROID_KEYSTORE_BASE64: ${{ secrets.REMUX_ANDROID_KEYSTORE_BASE64 }}
          REMUX_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.REMUX_ANDROID_KEYSTORE_PASSWORD }}
          REMUX_ANDROID_KEY_ALIAS: ${{ secrets.REMUX_ANDROID_KEY_ALIAS }}
          REMUX_ANDROID_KEY_PASSWORD: ${{ secrets.REMUX_ANDROID_KEY_PASSWORD }}
        run: |
          required=(
            REMUX_ANDROID_KEYSTORE_BASE64
            REMUX_ANDROID_KEYSTORE_PASSWORD
            REMUX_ANDROID_KEY_ALIAS
            REMUX_ANDROID_KEY_PASSWORD
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done

          signing_dir="$RUNNER_TEMP/remux-signing"
          install -d -m 700 "$signing_dir" dist
          printf '%s' "$REMUX_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$signing_dir/release.jks"
          chmod 600 "$signing_dir/release.jks"

          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$apksigner" ]]; then
            echo "Android SDK apksigner was not found" >&2
            exit 1
          fi

          "$apksigner" sign \
            --ks "$signing_dir/release.jks" \
            --ks-key-alias "$REMUX_ANDROID_KEY_ALIAS" \
            --ks-pass env:REMUX_ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:REMUX_ANDROID_KEY_PASSWORD \
            --out dist/remux-android-release.apk \
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$apksigner" verify --verbose --print-certs dist/remux-android-release.apk
      - name: Upload signed Android Release APK
        uses: actions/upload-artifact@v7
        with:
          name: remux-android-release
          path: dist/remux-android-release.apk
          if-no-files-found: error
          retention-days: 14

  musl:
    name: Linux static (${{ matrix.target }})
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}
      - name: Install Rust target
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.85.0
          rustup target add "${{ matrix.target }}"
      - name: Install Zig 0.13.0
        run: |
          zig_archive="$RUNNER_TEMP/zig-linux-x86_64-0.13.0.tar.xz"
          zig_dir="$RUNNER_TEMP/zig-linux-x86_64-0.13.0"
          curl --fail --location --retry 3 \
            --output "$zig_archive" \
            https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz
          echo "d45312e61ebcc48032b77bc4cf7fd6915c11fa16e4aad116b66c9468211230ea  $zig_archive" \
            | sha256sum --check --strict
          tar --extract --xz --file "$zig_archive" --directory "$RUNNER_TEMP"
          echo "$zig_dir" >> "$GITHUB_PATH"
      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --version 0.20.1 --locked
      - name: Build static archive
        run: scripts/build-musl.sh "${{ matrix.target }}"
      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: remux-linux-${{ matrix.target }}
          path: dist/remux-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
    needs: [test, android, android-release, musl]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: cd dist && sha256sum *.tar.gz remux-android-release.apk > SHA256SUMS
      - name: Create GitHub Release and upload files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be a semantic v* tag; got: $RELEASE_TAG" >&2
            exit 1
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --generate-notes
          gh release delete-asset "$RELEASE_TAG" remux-android-debug.apk \
            --repo "$GITHUB_REPOSITORY" --yes >/dev/null 2>&1 || true
          gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/remux-android-release.apk dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --clobber
