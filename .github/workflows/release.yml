name: CI and distributable binaries

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: remux-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install stock tmux
        run: sudo apt-get update && sudo apt-get install --yes tmux
      - name: Install project Rust toolchain
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component clippy
          rustup default 1.85.0
      - name: Cargo quality gate
        run: |
          cargo check
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test

  android:
    name: Android APKs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
            android/app/*.gradle.kts
      - name: Android quality gate
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleDebug assembleRelease lintDebug --no-daemon
      - name: Stage Android artifacts
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/remux-android-debug.apk
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk dist/remux-android-release-unsigned.apk
      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: remux-android
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

  musl:
    name: Linux static (${{ matrix.target }})
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust target
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.85.0
          rustup target add "${{ matrix.target }}"
      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0
      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --version 0.20.1 --locked
      - name: Build static archive
        run: scripts/build-musl.sh "${{ matrix.target }}"
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: remux-linux-${{ matrix.target }}
          path: dist/remux-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, android, musl]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: cd dist && sha256sum *.tar.gz *.apk > SHA256SUMS
      - name: Create GitHub Release and upload files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.apk dist/SHA256SUMS --clobber
